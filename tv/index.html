      toggle.classList.toggle('active', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.setAttribute('aria-label', open ? '收起菜单' : '展开菜单');
    });

    nav.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') {
        nav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('click', function (e) {
      if (!nav.contains(e.target) && !toggle.contains(e.target)) {
        nav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        nav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  }

  var onScroll = function () {
    if (!header) return;
    header.classList.toggle('scrolled', window.scrollY > 8);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function utf8ToB64(str) {
    try {
      return btoa(unescape(encodeURIComponent(str)));
    } catch (e) {
      return btoa(str);
    }
  }

  var playbox = document.getElementById('playbox');
  var playerLoader = document.getElementById('playerLoader');
  var currentChannel = document.getElementById('currentChannel');

  var loaderTimer = null;

  function showLoader(text) {
    if (loaderTimer) { clearTimeout(loaderTimer); loaderTimer = null; }
    if (!playerLoader) return;
    playerLoader.classList.remove('hidden');
    var span = playerLoader.querySelector('span:last-child');
    if (span && text) span.textContent = text;
  }

  function hideLoader() {
    if (loaderTimer) { clearTimeout(loaderTimer); loaderTimer = null; }
    if (playerLoader) playerLoader.classList.add('hidden');
  }

  function renderPlayerError(message) {
    if (!playerLoader) return;
    playerLoader.classList.remove('hidden');
    playerLoader.innerHTML =
      '<div class="state" style="padding:24px 16px">' +
        '<div class="state-icon">!</div>' +
        '<p style="margin:0">' + escapeHtml(message) + '</p>' +
        '<button class="retry-btn" type="button" id="playerRetry">重新加载</button>' +
      '</div>';

    var retry = document.getElementById('playerRetry');
    if (retry) retry.addEventListener('click', function () { loadCurrentChannel(); });
  }

  function initPlayer(m3u8Url) {
    if (!playbox) return;
    if (!m3u8Url) {
      renderPlayerError('无效的播放地址');
      return;
    }

    showLoader('直播流加载中…');
    playbox.innerHTML = '';

    var encodedUrl = utf8ToB64(m3u8Url);
    var iframe = document.createElement('iframe');
    iframe.allowFullscreen = true;
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.frameBorder = 'no';
    iframe.scrolling = 'no';
    iframe.title = '电视直播播放器';
    iframe.style.height = '100%';
    iframe.style.width = '100%';
    iframe.src = 'https://jiexi.bot.cd/url/?url=' + encodedUrl;

    iframe.addEventListener('load', hideLoader);

    playbox.appendChild(iframe);

    loaderTimer = setTimeout(hideLoader, 8000);
  }

  function loadCurrentChannel() {
    if (currentChannel) currentChannel.textContent = '正在加载频道…';
    showLoader('频道信息加载中…');

    fetch('https://json.bingdou.cc/tv/?id=cctv13', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('网络响应失败：' + res.status);
        return res.json();
      })
      .then(function (data) {
        var list = data && data.data && data.data.list;
        var first = Array.isArray(list) ? list[0] : null;

        if (!first || !first.play_url) {
          throw new Error('无效的频道数据');
        }

        var name = data.name || 'CCTV-13';
        if (currentChannel) currentChannel.textContent = '正在播放 - ' + name;
        document.title = name + ' - 电视直播 - 冰豆直播';

        initPlayer(first.play_url);
      })
      .catch(function (err) {
        console.error('加载频道失败:', err);
        if (currentChannel) currentChannel.textContent = '频道加载失败';
        renderPlayerError(err.message || '频道加载失败，请稍后重试');
      });
  }

  function loadChannelList(category, containerId, countId) {
    var container = document.getElementById(containerId);
    var countEl = countId ? document.getElementById(countId) : null;

    if (!container) return;

    container.className = 'skeleton';
    container.innerHTML = '';
    var skFrag = document.createDocumentFragment();
    for (var s = 0; s < 10; s++) {
      var sk = document.createElement('div');
      sk.className = 'sk-item';
      skFrag.appendChild(sk);
    }
    container.appendChild(skFrag);

    if (countEl) countEl.hidden = true;

    fetch('https://json.bingdou.cc/tv/list/?id=' + encodeURIComponent(category), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('网络响应失败：' + res.status);
        return res.json();
      })
      .then(function (data) {
        var list = data && data.data && data.data.list;
        if (!Array.isArray(list) || !list.length) {
          renderListState(container, '暂无频道数据');
          return;
        }
        renderChannels(container, list, countEl);
      })
      .catch(function (err) {
        console.error('加载 ' + category + ' 失败:', err);
        renderListState(container, '频道加载失败，请稍后重试', category, containerId, countId);
      });
  }

  function renderChannels(container, list, countEl) {
    container.className = 'channels playlist';
    container.innerHTML = '';

    var frag = document.createDocumentFragment();

    list.forEach(function (item, i) {
      var a = document.createElement('a');
      a.className = 'channel';
      a.href = './player/?id=' + encodeURIComponent(item.id);
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = item.name || ('频道 ' + (i + 1));
      a.style.animationDelay = Math.min(i * 18, 540) + 'ms';

      var no = document.createElement('span');
      no.className = 'channel-no';
      no.textContent = String(i + 1);

      var name = document.createElement('span');
      name.className = 'channel-name';
      name.textContent = item.name || ('频道 ' + (i + 1));

      a.appendChild(no);
      a.appendChild(name);
      frag.appendChild(a);
    });

    container.appendChild(frag);

    if (countEl) {
      countEl.textContent = list.length + ' 个频道';
      countEl.hidden = false;
    }
  }

  function renderListState(container, message, category, containerId, countId) {
    container.className = 'channels playlist';
    container.innerHTML =
      '<div class="state" style="grid-column:1/-1">' +
        '<div class="state-icon">!</div>' +
        '<p style="margin:0">' + escapeHtml(message) + '</p>' +
        (category
          ? '<button class="retry-btn" type="button">重新加载</button>'
          : '') +
      '</div>';

    if (category) {
      var retry = container.querySelector('.retry-btn');
      if (retry) {
        retry.addEventListener('click', function () {
          loadChannelList(category, containerId, countId);
        });
      }
    }

    var countEl = countId ? document.getElementById(countId) : null;
    if (countEl) countEl.hidden = true;
  }

  /* ==================== 启动 ==================== */
  function initPage() {
    loadCurrentChannel();

    loadChannelList('zhongyang', 'zhongyangChannels', 'zhongyangCount');
    loadChannelList('weishi', 'weishiChannels', 'weishiCount');
    loadChannelList('difang', 'difangChannels', 'difangCount');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPage);
  } else {
    initPage();
  }

})();
</script>
