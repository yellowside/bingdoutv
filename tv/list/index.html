<script>
(function () {
  'use strict';

  var header = document.getElementById('siteHeader');
  var toggle = document.getElementById('navToggle');
  var nav = document.getElementById('mainNav');
  var yearEl = document.getElementById('year');

  if (yearEl) yearEl.textContent = new Date().getFullYear();

  if (toggle && nav) {
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('open');
      toggle.classList.toggle('active', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.setAttribute('aria-label', open ? '收起菜单' : '展开菜单');
    });

    nav.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') {
        nav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('click', function (e) {
      if (!nav.contains(e.target) && !toggle.contains(e.target)) {
        nav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        nav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  }

  var onScroll = function () {
    if (!header) return;
    header.classList.toggle('scrolled', window.scrollY > 8);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function getParam(key) {
    return new URLSearchParams(window.location.search).get(key);
  }

  var channelList = document.getElementById('channelList');
  var pageTitle = document.getElementById('pageTitle');
  var crumbName = document.getElementById('crumbName');
  var countBadge = document.getElementById('countBadge');
  var listHint = document.getElementById('listHint');

  var categoryId = getParam('id');

  document.title = '电视直播 - 冰豆直播';
  if (!categoryId) {
    if (crumbName) crumbName.textContent = '参数错误';
    if (pageTitle) pageTitle.firstChild.textContent = '缺少分类参数';
  }

  function renderSkeleton(n) {
    var html = '';
    for (var i = 0; i < n; i++) html += '<div class="sk-item"></div>';
    channelList.className = 'skeleton';
    channelList.innerHTML = html;
  }

  function renderState(type, message, canRetry) {
    var icon = type === 'error' ? '!' : '…';
    var btn = canRetry
      ? '<button class="retry-btn" type="button" id="retryBtn">重新加载</button>'
      : '';

    channelList.className = 'channels';
    channelList.innerHTML =
      '<div class="state" style="grid-column:1/-1">' +
        '<div class="state-icon">' + icon + '</div>' +
        '<p>' + escapeHtml(message) + '</p>' +
        btn +
      '</div>';

    var retry = document.getElementById('retryBtn');
    if (retry) retry.addEventListener('click', loadChannels);
  }

  function setBadge(count) {
    if (!countBadge) return;
    if (typeof count === 'number') {
      countBadge.textContent = count + ' 个频道';
      countBadge.hidden = false;
    } else {
      countBadge.hidden = true;
    }
  }

  function setHint(text) {
    if (listHint) listHint.textContent = text || '';
  }

  function renderChannels(list) {
    if (!list.length) {
      setBadge(null);
      setHint('');
      renderState('empty', '该分类下暂无频道，换个分类试试吧', false);
      return;
    }

    channelList.className = 'channels';
    channelList.innerHTML = '';

    var frag = document.createDocumentFragment();

    list.forEach(function (item, i) {
      var a = document.createElement('a');
      a.className = 'channel';
      a.href = '../player/?id=' + encodeURIComponent(item.id);
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = item.name || ('频道 ' + (i + 1));
      a.style.animationDelay = Math.min(i * 18, 540) + 'ms';

      var no = document.createElement('span');
      no.className = 'channel-no';
      no.textContent = String(i + 1);

      var name = document.createElement('span');
      name.className = 'channel-name';
      name.textContent = item.name || ('频道 ' + (i + 1));

      a.appendChild(no);
      a.appendChild(name);
      frag.appendChild(a);
    });

    channelList.appendChild(frag);

    setBadge(list.length);
    setHint('点击频道进入播放页');
  }

    if (!categoryId) {
      setBadge(null);
      setHint('');
      renderState('error', '缺少分类参数，无法加载频道', false);
      return;

    setHint('加载中…');
    setBadge(null);

        if (!Array.isArray(list)) {

        if (crumbName) crumbName.textContent = title;
        if (pageTitle) pageTitle.firstChild.textContent = title;

        renderChannels(list);
      })
      .catch(function (err) {
        console.error('加载失败:', err);
        setHint('');
        if (crumbName) crumbName.textContent = '加载失败';
        if (pageTitle) pageTitle.firstChild.textContent = '加载失败';
        renderState('error', err.message || '数据加载失败，请检查网络后重试', true);
      });
  }

  loadChannels();

  window.addEventListener('popstate', loadChannels);

})();
</script>
