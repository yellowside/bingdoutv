      <span class="sep"></span>
      <a href="https://api.bingdou.com.cn/qq/im/?qq=77696199" target="_blank" rel="noopener">联系我们</a>
      <span class="sep"></span>
      <a href="https://www.bingdou.com.cn/code/464.html" target="_blank" rel="noopener">直播接口</a>
    </div>
    <p class="copyright">&copy; 2012-<span id="year">2026</span> bingdou.live, All Rights Reserved.</p>
  </div>
</footer>
<script>
(function () {
  'use strict';

  var header = document.getElementById('siteHeader');
  var toggle = document.getElementById('navToggle');
  var nav = document.getElementById('mainNav');
  var yearEl = document.getElementById('year');

  if (yearEl) yearEl.textContent = new Date().getFullYear();

  if (toggle && nav) {
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('open');
      toggle.classList.toggle('active', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      toggle.setAttribute('aria-label', open ? '收起菜单' : '展开菜单');
    });

    nav.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') {
        nav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('click', function (e) {
      if (!nav.contains(e.target) && !toggle.contains(e.target)) {
        nav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        nav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  }

  var onScroll = function () {
    if (!header) return;
    header.classList.toggle('scrolled', window.scrollY > 8);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function getParam(key) {
    return new URLSearchParams(window.location.search).get(key);
  }

  var keywordInput = document.getElementById('keyword');
  var resultTitle = document.getElementById('result-title');
  var playlistContainer = document.getElementById('playlist-container');
  var countBadge = document.getElementById('countBadge');
  var resultHint = document.getElementById('resultHint');
  var cardEl = playlistContainer.closest('.card');

  var keyword = getParam('wd');
  if (keyword && keywordInput) keywordInput.value = keyword;

  function setBadge(count, text) {
    if (!countBadge) return;
    if (typeof count === 'number') {
      countBadge.textContent = count + ' ' + (text || '部');
      countBadge.hidden = false;
    } else {
      countBadge.hidden = true;
    }
  }

  function setHint(text) {
    if (resultHint) resultHint.textContent = text || '';
  }

  function renderMovieSkeleton(n) {
    var html = '';
    for (var i = 0; i < n; i++) html += '<div class="sk-item"></div>';
    playlistContainer.className = 'skeleton';
    playlistContainer.innerHTML = html;
  }

  function renderResultSkeleton(n) {
    var html = '';
    for (var i = 0; i < n; i++) {
      html +=
        '<div class="result" style="pointer-events:none">' +
          '<div class="result-top">' +
            '<span class="sk-item" style="width:30px;height:30px;border-radius:10px;animation:shimmer 1.25s ease-in-out infinite"></span>' +
            '<span style="flex:1"><span class="sk-item" style="display:block;height:16px;margin-bottom:6px;animation:shimmer 1.25s ease-in-out infinite"></span>' +
            '<span class="sk-item" style="display:block;height:16px;width:62%;animation:shimmer 1.25s ease-in-out infinite"></span></span>' +
          '</div>' +
          '<div class="result-meta">' +
            '<span class="sk-item" style="width:64px;height:20px;border-radius:999px;animation:shimmer 1.25s ease-in-out infinite"></span>' +
            '<span class="sk-item" style="width:88px;height:20px;border-radius:999px;animation:shimmer 1.25s ease-in-out infinite"></span>' +
          '</div>' +
          '<div class="result-foot">' +
            '<span class="sk-item" style="width:90px;height:16px;animation:shimmer 1.25s ease-in-out infinite"></span>' +
            '<span class="sk-item" style="margin-left:auto;width:62px;height:28px;border-radius:9px;animation:shimmer 1.25s ease-in-out infinite"></span>' +
          '</div>' +
        '</div>';
    }
    playlistContainer.className = 'result-list';
    playlistContainer.innerHTML = html;
  }

  function renderState(type, message) {
    var icon = type === 'error' ? '!' : '…';
    var btn = type === 'error'
      ? '<button class="retry-btn" type="button" id="retryBtn">重新加载</button>'
      : '';

    playlistContainer.className = 'movies';
    playlistContainer.innerHTML =
      '<div class="state" style="grid-column:1/-1">' +
        '<div class="state-icon">' + icon + '</div>' +
        '<p>' + escapeHtml(message) + '</p>' +
        btn +
      '</div>';

    var retry = document.getElementById('retryBtn');
    if (retry) {
      retry.addEventListener('click', function () {
        if (keyword) searchMovies(keyword);
        else loadRecommend();
      });
    }
  }

  function renderRecommend(list) {
    if (!list.length) {
      setBadge(null);
      renderState('empty', '暂无推荐影片，稍后再来看看吧');
      return;
    }

    playlistContainer.className = 'movies';
    playlistContainer.innerHTML = '';

    var frag = document.createDocumentFragment();

    list.forEach(function (movie, i) {
      var a = document.createElement('a');
      a.className = 'movie';
      a.href = '../film/player/?id=' + encodeURIComponent(movie.id);
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = movie.name || '';
      a.style.animationDelay = Math.min(i * 18, 540) + 'ms';

      var icon = document.createElement('span');
      icon.className = 'movie-icon';
      icon.textContent = '▶';

      var name = document.createElement('span');
      name.className = 'movie-name';
      name.textContent = movie.name || '未命名影片';

      a.appendChild(icon);
      a.appendChild(name);
      frag.appendChild(a);
    });

    playlistContainer.appendChild(frag);

    setBadge(list.length, '部');
    setHint('高清影视资源，点击即可播放');
  }

  function loadRecommend() {
    if (resultTitle) resultTitle.textContent = '猜你喜欢';
    setHint('加载中…');
    setBadge(null);
    renderMovieSkeleton(12);

    fetch('https://json.bingdou.cc/film/list/?id=yingshi', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('网络响应失败：' + res.status);
        return res.json();
      })
      .then(function (data) {
        var list = data && data.data && data.data.list;
        if (!Array.isArray(list)) {
          renderState('empty', '无法获取推荐影片数据');
          setHint('');
          return;
        }
        renderRecommend(list);
      })
      .catch(function (err) {
        console.error('加载失败:', err);
        setHint('');
        renderState('error', '推荐影片加载失败，请检查网络后重试');
      });
  }

  function renderResults(list) {
    if (!list.length) {
      setBadge(null);
      renderState('empty', '没有找到相关影片，换个关键词试试');
      return;
    }

    playlistContainer.className = 'result-list';
    playlistContainer.innerHTML = '';

    var frag = document.createDocumentFragment();

    list.forEach(function (movie, i) {
      var playUrl = './player/?zy=' +
        encodeURIComponent(movie.vod_play_from || '') +
        '&id=' + encodeURIComponent(movie.vod_id || '');

      var a = document.createElement('a');
      a.className = 'result';
      a.href = playUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = movie.vod_name || '';
      a.style.animationDelay = Math.min(i * 20, 600) + 'ms';

      var top = document.createElement('div');
      top.className = 'result-top';

      var icon = document.createElement('span');
      icon.className = 'result-icon';
      icon.textContent = '▶';

      var name = document.createElement('span');
      name.className = 'result-name';
      name.textContent = movie.vod_name || '未命名影片';

      top.appendChild(icon);
      top.appendChild(name);

      var meta = document.createElement('div');
      meta.className = 'result-meta';

      if (movie.type_name) {
        var tagType = document.createElement('span');
        tagType.className = 'tag accent';
        tagType.textContent = movie.type_name;
        meta.appendChild(tagType);
      }
      if (movie.vod_remarks) {
        var tagRemark = document.createElement('span');
        tagRemark.className = 'tag';
        tagRemark.textContent = movie.vod_remarks;
        meta.appendChild(tagRemark);
      }

      var foot = document.createElement('div');
      foot.className = 'result-foot';

      var time = document.createElement('span');
      time.className = 'result-time';
      time.textContent = movie.vod_time || '';

      var play = document.createElement('span');
      play.className = 'result-play';
      play.textContent = '在线播放';

      foot.appendChild(time);
      foot.appendChild(play);

      a.appendChild(top);
      if (meta.childNodes.length) a.appendChild(meta);
      a.appendChild(foot);

      frag.appendChild(a);
    });

    playlistContainer.appendChild(frag);

    setBadge(list.length, '部');
    setHint('点击卡片即可进入播放页');
  }

  function searchMovies(kw) {
    if (resultTitle) resultTitle.textContent = '搜索《' + kw + '》结果';
    document.title = kw + ' - 冰豆影视 - 冰豆直播';
    setHint('搜索中…');
    setBadge(null);
    renderResultSkeleton(6);

    fetch('https://json.bingdou.cc/movie/list/json/?wd=' + encodeURIComponent(kw), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('网络响应失败：' + res.status);
        return res.json();
      })
      .then(function (data) {
        var list = data && data.data && data.data.list;
        if (!Array.isArray(list)) {
          renderState('empty', '没有找到相关影片，换个关键词试试');
          setHint('');
          return;
        }
        renderResults(list);
      })
      .catch(function (err) {
        console.error('搜索失败:', err);
        setHint('');
        renderState('error', '搜索失败，请检查网络后重试');
      });
  }

  var form = document.getElementById('form1');
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var wd = keywordInput ? keywordInput.value.trim() : '';
      if (!wd) {
        if (keywordInput) {
          keywordInput.focus();
          keywordInput.style.transition = 'box-shadow .3s';
          keywordInput.style.boxShadow = '0 0 0 3px rgba(56,189,248,.35)';
          setTimeout(function () { keywordInput.style.boxShadow = ''; }, 900);
        }
        return;
      }
      window.location.href = '?wd=' + encodeURIComponent(wd);
    });
  }

  if (keyword) {
    searchMovies(keyword);
  } else {
    loadRecommend();
  }

})();
</script>
<script async src="https://01a19506-d7a7-7916-b03b-49db37e91d0e.spst2.com/ustat.js"></script>
</body>
