             ' title="' + escapeHtml(item.line) + '"' +

             ' style="animation-delay:' + Math.min(i * 24, 480) + 'ms">' +
               '<span class="line-name">' + escapeHtml(item.line) + '</span>' +
             '</button>';
    }).join('');

    app.innerHTML =
      '<div class="page-head">' +
        '<nav class="crumb" aria-label="面包屑">' +
          '<a href="../../">首页</a>' +
          '<span class="slash">/</span>' +
          '<a href="../">影视点播</a>' +
          '<span class="slash">/</span>' +
          '<span>' + escapeHtml(title) + '</span>' +
        '</nav>' +
        '<h1 class="page-title">' + escapeHtml(title) + '</h1>' +
        '<p class="page-sub">正在播放 · 蓝光画质 · 免费观看</p>' +
      '</div>' +

      '<section class="card player-card">' +
        '<div class="player-head">' +
          '<span class="live-dot"></span>' +
          '<h2 id="playingTitle">正在播放：' + escapeHtml(title) + '</h2>' +
        '</div>' +
        '<div class="player-stage">' +
          '<div class="player-loader" id="playerLoader">' +
            '<span class="spinner"></span>' +
            '<span>播放器加载中…</span>' +
          '</div>' +
          '<iframe name="player" id="playbox" allowfullscreen="true" frameborder="no" scrolling="no" title="播放器"></iframe>' +
        '</div>' +
      '</section>' +

      '<section class="card">' +
        '<div class="card-head">' +
          '<h2>播放列表</h2>' +
          '<span class="hint">共 ' + lines.length + ' 条线路</span>' +
        '</div>' +
        '<div class="lines" id="playlist">' +
          (lines.length ? lineBtns : '<div class="state" style="grid-column:1/-1"><div class="state-icon">…</div><p>暂无可用播放线路</p></div>') +
        '</div>' +
      '</section>' +

      '<section class="card">' +
        '<div class="card-head"><h2>剧情介绍</h2></div>' +
        '<p class="prose">' + formatText(intro) + '</p>' +
      '</section>' +

      '<section class="card">' +
        '<div class="card-head"><h2>免责声明</h2></div>' +
        '<p class="prose disclaimer">' +
          '本站所有内容均自动搜索链接于互联网第三方网站页面，并不存储任何视频、音频资源。因此经由本站搜索所产生的任何结果皆不代表本站立场，本站不对其真实合法性以及版权负责，亦不承担任何法律责任。本站所有接口皆源于互联网，仅供学习交流。' +
        '</p>' +
      '</section>';

    initPlayer(lines);
    bindPlaylist(lines);
  }

  function initPlayer(lines) {
    var frame = document.getElementById('playbox');
    var loader = document.getElementById('playerLoader');
    if (!frame) return;

    var timer = null;

    function hideLoader() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (loader) loader.classList.add('hidden');
    }

    frame.addEventListener('load', hideLoader);

    if (!lines.length) {
      if (loader) loader.innerHTML = '<span>暂无播放地址</span>';
      return;
    }

    frame.src = buildPlayerUrl(lines[0].play_url);
    timer = setTimeout(hideLoader, 8000);
  }

  function bindPlaylist(lines) {
    var playlist = document.getElementById('playlist');
    var frame = document.getElementById('playbox');
    var loader = document.getElementById('playerLoader');
    if (!playlist || !frame) return;

    var current = 0;
    var timer = null;

    playlist.addEventListener('click', function (e) {
      var btn = e.target.closest('.line');
      if (!btn) return;

      var idx = Number(btn.dataset.idx);
      if (isNaN(idx) || idx === current || !lines[idx]) return;

      current = idx;

      playlist.querySelectorAll('.line').forEach(function (el) {
        el.classList.remove('active');
        el.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');

      if (loader) loader.classList.remove('hidden');

      if (timer) { clearTimeout(timer); timer = null; }

      frame.src = buildPlayerUrl(lines[idx].play_url);

      var title = document.getElementById('playingTitle');
      if (title) title.textContent = '正在播放：' + (lines[idx].line || '');

      timer = setTimeout(function () {
        if (loader) loader.classList.add('hidden');
      }, 8000);
    });
  }

  function loadMovie() {
    var zy = getParam('zy');
    var id = getParam('id');

    if (!id) {
      renderError('缺少影片 ID，无法播放');
      return;
    }

    var apiUrl = 'https://json.bingdou.cc/movie/?zy=' +
      encodeURIComponent(zy || '') + '&id=' + encodeURIComponent(id);

    fetch(apiUrl, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data || !data.title) throw new Error('返回数据格式异常');
        renderPlayerPage(data);
      })
      .catch(function (err) {
        console.error('加载失败:', err);
        renderError('影片加载失败，请检查网络后重试');
      });
  }

  loadMovie();
})();
</script>
