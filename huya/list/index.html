  }

  function renderSkeleton(n) {
    var html = '';
    for (var i = 0; i < n; i++) html += '<div class="sk-item"></div>';
    playlistContainer.className = 'skeleton';
    playlistContainer.innerHTML = html;
  }

  function renderState(type, message) {
    var icon = type === 'error' ? '!' : '…';
    var btn = type === 'error'
      ? '<button class="retry-btn" type="button" id="retryBtn">重新加载</button>'
      : '';

    playlistContainer.className = 'grid';
    playlistContainer.innerHTML =
      '<div class="state" style="grid-column:1/-1">' +
        '<div class="state-icon">' + icon + '</div>' +
        '<p>' + escapeHtml(message) + '</p>' +
        btn +
      '</div>';

    var retry = document.getElementById('retryBtn');
    if (retry) retry.addEventListener('click', loadList);
  }

  function renderList(list) {
    if (!list.length) {
      if (countBadge) countBadge.hidden = true;
      renderState('empty', '暂无直播间，稍后再来看看吧');
      return;
    }

    playlistContainer.className = 'grid';
    playlistContainer.innerHTML = '';

    var frag = document.createDocumentFragment();

    list.forEach(function (live, i) {
      var a = document.createElement('a');
      a.className = 'live-item';
      a.href = '../player/?id=' + encodeURIComponent(live.profileRoom);
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = live.introduction || live.roomName || ('直播间 ' + (i + 1));
      a.style.animationDelay = Math.min(i * 18, 540) + 'ms';

      a.appendChild(makeCover(live));

      var body = document.createElement('div');
      body.className = 'live-body';

      var nameEl = document.createElement('div');
      nameEl.className = 'live-name';
      nameEl.textContent = live.introduction || live.roomName || ('直播间 ' + (i + 1));
      body.appendChild(nameEl);

      var metaParts = [];
      if (live.nick) metaParts.push(live.nick);
      var hot = formatHot(live.totalCount);
      if (hot) metaParts.push(hot + '热度');

      if (metaParts.length) {
        var meta = document.createElement('div');
        meta.className = 'live-meta';

        if (live.nick) {
          var nickEl = document.createElement('span');
          nickEl.textContent = live.nick;
          meta.appendChild(nickEl);
        }

        if (hot) {
          if (live.nick) {
            var dot = document.createElement('span');
            dot.className = 'dot';
            meta.appendChild(dot);
          }
          var hotEl = document.createElement('span');
          hotEl.className = 'live-hot';
          hotEl.textContent = hot + '热度';
          meta.appendChild(hotEl);
        }

        body.appendChild(meta);
      }

      a.appendChild(body);
      frag.appendChild(a);
    });

    playlistContainer.appendChild(frag);

    if (countBadge) {
      countBadge.textContent = list.length + ' 个直播间';
      countBadge.hidden = false;
    }
  }

  function loadList() {
    if (!videoid) {
      if (countBadge) countBadge.hidden = true;
      renderState('error', '缺少直播分类 ID，无法加载列表');
      return;
    }

    renderSkeleton(12);
    if (countBadge) countBadge.hidden = true;

    fetch('https://json.bingdou.cc/huya/list/?id=' + encodeURIComponent(videoid), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('网络响应失败：' + res.status);
        return res.json();
      })
      .then(function (data) {
        var list = data && data.data && data.data.datas;
        if (!Array.isArray(list)) {
          renderState('empty', '没有找到直播间数据');
          return;
        }
        renderList(list);
      })
      .catch(function (err) {
        console.error('加载失败:', err);
        renderState('error', '直播间列表加载失败，请检查网络后重试');
      });
  }
  loadList();

})();
</script>
