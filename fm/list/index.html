      '</div>';

    var retry = document.getElementById('retryBtn');
    if (retry) retry.addEventListener('click', loadEpisodes);
  }

  function renderEpisodes(list) {
    playlistContainer.className = 'episodes';
    playlistContainer.innerHTML = '';

    if (!list.length) {
      if (episodeCount) episodeCount.textContent = '';
      playlistContainer.innerHTML =
        '<div class="state" style="grid-column:1/-1">' +
          '<div class="state-icon">…</div>' +
          '<p>暂无节目单，稍后再来看看吧</p>' +
        '</div>';
      return;
    }

    var frag = document.createDocumentFragment();

    list.forEach(function (item, i) {
      var a = document.createElement('a');
      a.className = 'episode';
      a.href = '../player/?id=' + encodeURIComponent(item.content_id);
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = item.title || '';
      a.style.animationDelay = Math.min(i * 24, 540) + 'ms';

      var icon = document.createElement('span');
      icon.className = 'episode-icon';
      icon.textContent = '▶';

      var nameEl = document.createElement('span');
      nameEl.className = 'episode-name';
      nameEl.textContent = item.title || '未命名节目';

      a.appendChild(icon);
      a.appendChild(nameEl);
      frag.appendChild(a);
    });

    playlistContainer.appendChild(frag);

    if (episodeCount) episodeCount.textContent = '共 ' + list.length + ' 个节目';
  }

  function loadEpisodes() {
    if (!id) {
      if (episodeCount) episodeCount.textContent = '';
      renderState('缺少电台参数，无法加载节目单');
      return;
    }

    renderSkeleton(10);
    if (episodeCount) episodeCount.textContent = '加载中…';

    fetch('https://json.bingdou.cc/fm/?id=' + encodeURIComponent(id), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var list = data && Array.isArray(data.data) ? data.data : null;
        if (!list) {
          if (episodeCount) episodeCount.textContent = '';
          renderState('节目单数据格式异常');
          return;
        }
        renderEpisodes(list);
      })
      .catch(function (err) {
        console.error('节目单加载失败:', err);
        if (episodeCount) episodeCount.textContent = '';
        renderState('节目单加载失败，请检查网络后重试');
      });
  }

  loadEpisodes();

})();
</script>
