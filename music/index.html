  var groupsEl = document.getElementById('groups');
  var countBadge = document.getElementById('countBadge');

  function buildUrl(item) {
    if (item.type === 'playlist') {
      return './playlist/?id=' + encodeURIComponent(item.id);
    }
    return './list/?cat=' + encodeURIComponent(item.id);
  }

  function renderGroups() {
    if (!groupsEl) return;

    var frag = document.createDocumentFragment();
    var total = 0;

    GROUPS.forEach(function (group) {
      total += group.items.length;

      var wrap = document.createElement('div');
      wrap.className = 'group';

      var label = document.createElement('div');
      label.className = 'group-label';
      label.innerHTML =
        '<span class="num">' + group.items.length + '</span>' +
        escapeHtml(group.label);

      var grid = document.createElement('div');
      grid.className = 'stations';

      group.items.forEach(function (item, i) {
        var a = document.createElement('a');
        a.className = 'station';
        a.href = buildUrl(item);
        a.target = '_blank';
        a.rel = 'noopener';
        a.title = item.name;
        a.style.animationDelay = Math.min(i * 20, 480) + 'ms';

        var icon = document.createElement('span');
        icon.className = 'station-icon';
        icon.textContent = '♪';

        var name = document.createElement('span');
        name.className = 'station-name';
        name.textContent = item.name;

        a.appendChild(icon);
        a.appendChild(name);
        grid.appendChild(a);
      });

      wrap.appendChild(label);
      wrap.appendChild(grid);
      frag.appendChild(wrap);
    });

    groupsEl.innerHTML = '';
    groupsEl.appendChild(frag);

    if (countBadge) {
      countBadge.textContent = total + ' 个分类';
      countBadge.hidden = false;
    }
  }

  renderGroups();
